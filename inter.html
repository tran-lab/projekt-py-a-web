<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>interstellar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: darkslateblue;
            background-image: url("obrazky/colorful.jpg");
        }

        .bg{
            border: 0px solid black;
            border-radius: 10%;
            height: wh;
            width: ww;
            padding: 25px;
            background-color: transparent;
            backdrop-filter: blur(15px);
            background-image: linear-gradient(
            120deg,
            rgba(255, 255, 255, 0.3),
            rgba(0, 0, 0, 0.2)
            );
            background-size: 20px;
        }

        .bg h1 {
            font-family: "Zen Dots", sans-serif;
            font-weight: 500;
            font-size: 50px;
            font-style: normal;
            color: white;
            text-align: center;
            text-shadow: 0 0 10px pink, 0 0 20px orangered, 0 0 30px red,
          0 0 40px magenta, 0 0 50px white;
            filter: saturate(60%);
            
        }

        .tym {
            border: 2px solid darkred;
            border-radius: 10px;
            height: 80px;
            width: 350px;
            color: darkred;
            font-size: 30px;
            background-color: lightpink;
            margin-left: 50px;

        }

        p {
            color: white;
            margin-left: 50px;
            font-size: 30px;
        }

        .down {
            border: 2px solid darkslateblue;
            border-radius: 10px;
            height: 50px;
            width: 300px;
            color: darkslateblue;
            background-color: lightsteelblue;
            margin-left: 50px;
        }

    </style>
</head>
<body>
    <div class="bg">
        <h1>INTERSTELLAR</h1>
    </div>
    <button id="tym" class="tym">Který tým je nejlepší?</button>
    <p id="nej"></p>
    <button id="py" class="down">Download</button>
    <a download="nahodny.py" onclick="interstellar()"></a>
    <script>
        let tlacitko = document.querySelector("#tym")
        tlacitko.addEventListener("click", team)

        function team(){
            let nej = "Nejlepší tým je 1"
            document.getElementById("nej").textContent = nej
        }

        let tlacitko2 = document.querySelector("#py")
        tlacitko2.addEventListener("click", interstellar)

        function interstellar(){
            let link = document.createElement("a")
            link.href = "https://github.com/tran-lab/projekt-py-a-web/blob/main/nahodny.py"
            link.click()
        }
        </script>
</body>
</html>
